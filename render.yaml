services:
  - type: web
    name: omwankar-scout
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    branch: master
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: WEB_DIST
        value: /app/apps/web/out
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/free
      - key: OPENROUTER_HTTP_REFERER
        value: https://omwankar-scout.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: Scout
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
